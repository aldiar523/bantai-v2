<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BantAI — contract</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body>
<header id="top"></header>
<main class="wrap" style="padding-top:24px;padding-bottom:64px" id="main"></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="assets/core.js"></script>
<script>
B.header('queue');
const id = new URLSearchParams(location.search).get('id');
const M = document.getElementById('main');
B.allContracts().then(({ list, reviewer, analyses, relay }) => {
  const c = list.find(x => x.id === id);
  if (!c) {
    M.innerHTML = `<div class="lock"><h1 style="font-size:28px">Not available</h1><p class="muted" style="line-height:1.55">${id ? `Contract <span class="num">${B.esc(id)}</span> is not in this week's public list. ${reviewer ? '' : 'If it carries mark B or C, <a href="signin.html">sign in as a reviewer</a>.'}` : 'No contract ID given.'}</p><p><a href="queue.html">← Back to the list</a></p></div>`;
    return;
  }
  document.title = `BantAI — ${c.id}`;
  const tierChip = `<span class="t t${c.tier}" style="height:28px;padding:0 10px;font-size:13px">${c.tier} · ${B.tierName[c.tier]}</span>`;
  const place = [c.city, c.province].filter(Boolean).join(', ');
  const icon = r => r.basis === 'A' ? '<span class="t tA" style="flex:none">A</span>' : r.basis === 'B' ? '<span class="t tB" style="flex:none">B</span>' : '<span class="t tS" style="flex:none;box-sizing:border-box">S</span>';
  const reasons = c.reasons.map(r => `<div class="reason">${icon(r)}<div style="min-width:0"><div style="font-size:16px;font-weight:500;line-height:1.45">${B.esc(r.text)}</div><div class="small muted" style="margin-top:6px">${r.basis === 'A' ? 'Official record' : r.basis === 'B' ? 'Rule' : 'Risk family · ' + B.esc(r.family)}${r.note ? ' · ' + B.esc(r.note) : ''}${r.source ? ` · <a href="${B.esc(r.source)}" target="_blank" rel="noopener">source</a>` : ''}</div></div></div>`).join('');

  // timeline
  const ev = c.events.slice();
  const snap = sessionStorage.getItem('bantai-snap');
  let tl = '';
  if (ev.length) {
    const t0 = new Date(ev[0].date).getTime(), t1 = Date.now(), pos = d => Math.max(0, Math.min(100, (new Date(d).getTime() - t0) / (t1 - t0) * 100));
    const groups = [];
    ev.forEach(e => { const g = groups[groups.length - 1]; if (g && pos(e.date) - g.pos < 14) g.items.push(e); else groups.push({ pos: pos(e.date), items: [e] }); });
    tl = `<div style="position:relative;height:84px;margin:0 6px 0 0"><div style="position:absolute;left:0;right:0;top:30px;height:2px;background:#C9C4B8"></div>` +
      groups.map(g => { const alert = g.items.some(e => e.alert), right = g.pos > 80;
        return `<div style="position:absolute;left:${g.pos}%;top:0;${right ? 'transform:translateX(-100%);text-align:right' : ''}">
          <div class="num tiny muted" style="white-space:nowrap">${g.items.map(e => B.date(e.date)).join(' · ')}</div>
          <div style="position:absolute;top:24px;${right ? 'right:0' : 'left:0'};display:flex;gap:4px">${g.items.map(e => `<span style="width:12px;height:12px;display:inline-block;${e.alert ? 'transform:rotate(45deg);background:var(--a)' : 'border-radius:50%;background:var(--ink)'}"></span>`).join('')}</div>
          <div class="small" style="margin-top:30px;white-space:nowrap;${alert ? 'font-weight:500' : ''}">${g.items.map(e => B.esc(e.label)).join(' · ')}</div></div>`; }).join('') +
      `<div style="position:absolute;right:0;top:0;text-align:right"><div class="num tiny muted">today</div><div style="position:absolute;top:24px;right:0;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-sizing:border-box"></div></div></div>`;
  }
  const prog = c.progress != null ? `<div style="margin-top:22px;display:flex;flex-wrap:wrap;gap:32px;align-items:flex-end">
      <div style="flex:1 1 360px;min-width:0"><div class="small muted" style="display:flex;justify-content:space-between"><span>Work done</span><span class="num" style="color:var(--ink);font-weight:500">${c.progress.toFixed(1)}%</span></div>
      <div style="margin-top:8px;height:10px;background:#E4E1D9;border-radius:0;overflow:hidden"><div style="width:${c.progress}%;height:100%;background:var(--ink)"></div></div></div>
      ${c.days_since_start != null ? `<div style="font-size:14px;color:var(--ink2)"><span class="num" style="font-size:22px;color:var(--ink);font-weight:500">${B.n(c.days_since_start)}</span> days since start</div>` : ''}</div>
      <p class="small muted" style="margin:12px 0 0">${c.planned_end ? 'Planned completion: ' + B.date(c.planned_end) + '.' : 'Planned completion is not given in the DPWH list. Ask for the contract time and any extensions.'}</p>` : '';

  const price = c.price ? (() => {
    const max = Math.max(c.price.per_km, c.price.p95) * 1.1, p = x => (100 * x / max).toFixed(1) + '%';
    return `<div style="margin-top:26px"><div class="small muted">Price per km against ${B.n(c.price.n)} roads, ${B.esc(c.region)}, ${c.year} · ${c.price.km} km from the stations in the title</div>
      <div style="position:relative;height:64px;margin-top:10px">
        <div style="position:absolute;left:0;right:0;top:22px;height:6px;border-radius:3px;background:#E4E1D9"></div>
        <div style="position:absolute;left:${p(c.price.p95)};right:0;top:22px;height:6px;background:#F2C9A6"></div>
        <div style="position:absolute;left:${p(c.price.p50)};top:16px;width:2px;height:18px;background:var(--muted)"></div><div class="num tiny muted" style="position:absolute;left:${p(c.price.p50)};top:40px;transform:translateX(-50%)">median ${(c.price.p50 / 1e6).toFixed(1)}</div>
        <div style="position:absolute;left:${p(c.price.p95)};top:16px;width:2px;height:18px;background:var(--muted)"></div><div class="num tiny muted" style="position:absolute;left:${p(c.price.p95)};top:40px;transform:translateX(-60%)">95th ${(c.price.p95 / 1e6).toFixed(1)}</div>
        <div style="position:absolute;left:${p(c.price.per_km)};top:14px;width:22px;height:22px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1px var(--ink);transform:translateX(-50%)"></div><div class="num tiny" style="position:absolute;left:${p(c.price.per_km)};top:-6px;font-weight:500;transform:translateX(-50%)">${(c.price.per_km / 1e6).toFixed(1)}</div>
      </div><div class="num tiny" style="display:flex;justify-content:space-between;color:var(--faint)"><span>₱0</span><span>₱${(max / 1e6).toFixed(0)} M per km</span></div></div>`;
  })() : '';

  const docs = c.links.length ? c.links.map(l => `<a href="${B.esc(l.url)}" target="_blank" rel="noopener" style="display:flex;justify-content:space-between;min-height:44px;align-items:center;border-bottom:1px solid var(--line2);font-size:14px;text-decoration:none">${B.esc(l.label)}<span class="muted">↗</span></a>`).join('')
    : `<p class="small muted" style="margin:6px 0 0;line-height:1.5">No document links in our data for this contract. Search the contract ID on the DPWH transparency portal or PhilGEPS.</p>`;

  function matrix(m) {
    const dot = st => st === 'fired' ? '<span title="triggered" style="flex:none;width:12px;height:12px;border-radius:50%;background:var(--ink);margin-top:4px"></span>'
      : st === 'clear' ? '<span title="checked, clear" style="flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--faint);box-sizing:border-box;margin-top:4px"></span>'
      : '<span title="not checked" style="flex:none;width:12px;height:2px;background:#C9C4B8;margin-top:9px"></span>';
    const row = it => `<div style="display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14px;${it.status === 'fired' ? 'font-weight:500' : it.status === 'clear' ? '' : 'color:var(--faint)'}">${dot(it.status)}<span>${B.esc(it.name)}${it.why ? `<span class="tiny" style="display:block;color:var(--faint);font-weight:400">${B.esc(it.why)}</span>` : ''}</span></div>`;
    const col = (t, title, body, n) => `<div class="card" style="padding:18px;${n ? '' : 'opacity:.92'}"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span class="t t${t}">${t}</span><span style="font-weight:600;font-size:15px">${title}</span><span class="num tiny muted" style="margin-left:auto">${n} triggered</span></div>${body}</div>`;
    const nA = m.A.filter(x => x.status === 'fired').length, nB = m.B.filter(x => x.status === 'fired').length;
    const fams = m.C.map(f => ({ ...f, on: f.items.some(x => x.status === 'fired') }));
    const nC = fams.filter(f => f.on).length;
    const cBody = fams.map(f => `<div style="padding:6px 0;border-top:1px solid var(--line2)"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;padding-top:4px"><span>${B.esc(f.family)}</span><span class="tiny" style="font-weight:500;color:${f.on ? 'var(--ink)' : 'var(--faint)'}">${f.on ? 'counts' : ''}</span></div>${f.items.map(row).join('')}</div>`).join('');
    return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start">
      ${col('A', 'Official record', m.A.map(row).join(''), nA)}${col('B', 'Rules', m.B.map(row).join(''), nB)}
      ${col('C', 'Risk families', `<div class="tiny muted" style="margin-bottom:4px">${nC} of ${fams.length} risk families · 3 or more makes mark C</div>` + cBody, nC)}</div>
      <p class="tiny muted" style="margin:10px 0 0;display:flex;gap:18px;flex-wrap:wrap"><span>● triggered</span><span>○ checked, clear</span><span>— not checked: data missing</span></p>`;
  }
  const A = (analyses || {})[c.id];
  const ai = !reviewer ? '' : A ? `
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2 style="font-size:17px">AI review</h2><span class="tiny muted">${B.esc(A.written || '')} · advice only</span></div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><span class="chip on" style="cursor:default">${B.esc(A.category)}</span><span class="chip" style="cursor:default">${B.esc(A.coherence || '')}</span></div>
      <p style="margin:12px 0 0;font-size:14px;line-height:1.6">${B.esc(A.summary)}</p>
      ${(A.ordinary_explanations || []).length ? `<p class="label" style="margin:16px 0 6px">Ordinary explanations</p><ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.55">${A.ordinary_explanations.map(o => `<li><b style="font-weight:500">${B.esc(o.item)}</b>: ${B.esc(o.status)}${o.evidence ? ' — ' + B.esc(o.evidence) : ''}</li>`).join('')}</ul>` : ''}
      ${(A.findings || []).length ? `<p class="label" style="margin:16px 0 6px">Found outside our data</p><ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.55">${A.findings.map(f => `<li>${B.esc(f.claim)} <a href="${B.esc(f.url)}" target="_blank" rel="noopener">${B.esc(f.source_name || 'source')}</a>${f.date ? ', ' + B.esc(f.date) : ''}</li>`).join('')}</ul>` : '<p class="small muted" style="margin:12px 0 0">Nothing found outside our data.</p>'}
      ${(A.next_steps || []).length ? `<p class="label" style="margin:16px 0 6px">Next steps</p><ol style="margin:0;padding-left:18px;font-size:13px;line-height:1.55">${A.next_steps.map(x => `<li>${B.esc(x)}</li>`).join('')}</ol>` : ''}
      ${A.caveat ? `<p class="tiny muted" style="margin:14px 0 0">${B.esc(A.caveat)}</p>` : ''}
    </section>` : `
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="font-size:17px">AI review</h2><span class="tiny muted">reviewers only</span></div>
      <ul style="margin:10px 0 12px;padding:0 0 0 18px;font-size:14px;line-height:1.6;color:var(--ink2)"><li>Summary of the file and why it was marked</li><li>Ordinary explanations to rule out</li><li>Search of news, official statements and court records</li><li>Next document and site checks</li></ul>
      <p class="small muted" style="margin:0 0 14px">Every claim links to its source. It advises; you decide.</p>
      <button class="btn dark" id="aiBtn" style="width:100%;justify-content:center;min-height:44px">Request AI review</button>
      <p class="small muted" id="aiMsg" style="margin:10px 0 0" role="status"></p>
    </section>`;
  const side = reviewer ? `
    <section class="card" style="border-top:6px solid var(--red)">
      <h2 style="font-size:17px">Your decision</h2>
      <p class="small muted" style="margin:6px 0 16px">Saved on this device for now. Team-wide recording is the next step.</p>
      <div class="decide" role="radiogroup" aria-label="Decision">${[['escalate', 'Escalate'], ['monitor', 'Monitor'], ['clear', 'No concern'], ['error', 'Data error']].map(([k, l]) => `<button role="radio" aria-checked="false" data-d="${k}">${l}</button>`).join('')}</div>
      <label class="small" style="display:block;margin-top:14px;color:var(--ink2)">Reason<textarea id="why" rows="3" placeholder="One or two lines: what you saw and where" style="margin-top:6px"></textarea></label>
      <div class="err" id="derr" role="alert"></div>
      <button class="btn dark" id="save" style="width:100%;justify-content:center;min-height:44px">Save decision</button>
    </section>
    ${ai}` : `
    <section class="card"><h2 style="font-size:17px">For the review team</h2><p class="small muted" style="margin:8px 0 14px;line-height:1.55">Decisions and AI reviews are open to reviewers.</p><a class="btn" href="signin.html" style="text-decoration:none">Reviewer sign-in</a></section>`;

  M.innerHTML = `
  <a href="queue.html" class="small" style="text-decoration:none;color:var(--ink2)">← ${reviewer ? 'Queue' : 'Official records'}</a>
  <section style="margin-top:16px;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:28px;border-bottom:3px solid var(--ink)">
    <div style="flex:1 1 640px;min-width:0">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">${tierChip}<span class="num" style="font-size:15px;font-weight:500">${c.id}</span><span class="small" style="color:var(--ink2)">${B.esc(c.status)} · ${B.esc(c.office)}${place ? ' · ' + B.esc(place) : ''}</span></div>
      <h1 style="margin-top:16px;font-size:${c.title.length > 140 ? 'clamp(20px,1.9vw,26px)' : c.title.length > 80 ? 'clamp(22px,2.2vw,30px)' : 'clamp(26px,2.8vw,38px)'};line-height:1.14;max-width:900px">${B.esc(c.title)}</h1>
      ${c.status_notes.length ? `<div style="margin-top:14px;display:inline-flex;gap:10px;align-items:flex-start;padding:10px 14px;background:#FFF3C4;border-left:6px solid var(--orange);border-radius:0;font-size:15px;font-weight:500;color:#3A2A00;max-width:820px"><span aria-hidden="true">!</span><span>${c.status_notes.map(B.esc).join(' ')}</span></div>` : ''}
    </div>
    <div style="text-align:right"><div class="num" style="font-size:clamp(24px,2.6vw,36px);font-weight:600;letter-spacing:-.02em;white-space:nowrap">${B.peso(c.amount)}</div><div class="small muted">contract amount</div></div>
  </section>
  <div style="display:flex;flex-wrap:wrap;gap:40px;margin-top:32px">
    <div style="flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:44px">
      <section><p class="label">Why it is in the list</p>${reasons}${c.context.length ? '<p class="small muted" style="margin:12px 0 0">Context, not counted: the province\'s share of elected officials from political families is above the national average.</p>' : ''}</section>
      <section><p class="label">All checks</p>${matrix(c.matrix)}</section>
      ${tl || prog ? `<section><p class="label">Timeline and progress</p>${tl}${prog}</section>` : ''}
      ${c.lat ? `<section><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px"><p class="label" style="margin:0">Site</p><div class="seg" role="group" aria-label="Map layer"><button class="on" data-l="map">Map</button><button data-l="sat">Satellite</button><button data-l="hist">Satellite over time</button></div></div>
        <div id="map" role="region" aria-label="Map of the contract site"></div>
        <p class="small" id="capt" aria-live="polite" style="margin:8px 0 0;color:var(--ink2)"></p>
        <div id="hist" hidden style="margin-top:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:0">
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px"><button class="chip" id="hBefore">Before the start</button><button class="chip" id="hLatest">Latest</button>
          <label class="small muted" style="display:flex;align-items:center;gap:10px;flex:1 1 260px">Release <input id="hRange" type="range" min="0" max="0" value="0" style="flex:1"></label><span class="num small" id="hDate"></span></div>
          <p class="tiny muted" style="margin:8px 0 0">Esri World Imagery archive (Wayback). The release date is when the archive was published; the date the photo at the marker was taken is shown under the map. Compare releases before the start and now.</p>
        </div>
        <p class="small muted" style="margin:10px 0 0">${B.esc(c.loc_note)} <span class="num">${c.lat.toFixed(5)}, ${c.lon.toFixed(5)}</span> · <a href="https://www.openstreetmap.org/?mlat=${c.lat}&mlon=${c.lon}#map=16/${c.lat}/${c.lon}" target="_blank" rel="noopener">Open in OpenStreetMap</a></p></section>` : ''}
      <section><p class="label">Money</p><div class="kv">
        <div><div class="big">${B.peso(c.abc)}</div><div class="small muted" style="margin-top:4px">approved budget</div></div>
        <div><div class="big">${B.peso(c.award || c.amount)}</div><div class="small muted" style="margin-top:4px">${c.abc && (c.award || c.amount) ? 'awarded, ' + (100 * (c.award || c.amount) / c.abc).toFixed(1) + '% of budget' : 'contract amount'}</div></div>
        <div><div class="big">${c.award_date ? B.date(c.award_date) : '—'}</div><div class="small muted" style="margin-top:4px">award${c.mode ? ' · ' + B.esc(c.mode) : ''}</div></div>
      </div>${price}</section>
      <section><p class="label">Contractor</p><div class="card">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:baseline"><span style="font-size:17px;font-weight:500">${B.esc(c.contractor)}</span><span class="num small muted">${c.licence ? (c.jv ? 'joint venture · PCAB ' : 'PCAB ') + c.licence : ''}${c.licence_cat ? ' · category ' + c.licence_cat : ''}</span></div>
        <div style="margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px">
          <div><div class="big" style="font-size:20px">${B.n(c.firm.contracts)}</div><div class="small muted">DPWH contracts</div></div>
          <div><div class="big" style="font-size:20px">${B.n(c.firm.open)}</div><div class="small muted">open now</div></div>
          <div><div class="big" style="font-size:20px">${B.peso(c.firm.value)}</div><div class="small muted">total value</div></div>
          <div><div class="big" style="font-size:20px">${B.n(c.firm.terminated)}</div><div class="small muted">terminated</div></div></div></div></section>
      ${c.checks.length ? `<section><p class="label">What to check</p><ol style="margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5">${c.checks.map(x => `<li>${B.esc(x)}</li>`).join('')}</ol></section>` : ''}
    </div>
    <aside style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:20px">${side}
      <section class="card"><h2 style="font-size:17px;margin-bottom:6px">Documents</h2>${docs}<button class="btn" onclick="print()" style="margin-top:14px;width:100%;justify-content:center;min-height:44px;background:var(--bg)">Print dossier (PDF)</button></section>
    </aside>
  </div>`;

  if (c.lat && window.L) {
    const map = L.map('map', { scrollWheelZoom: false }).setView([c.lat, c.lon], 16);
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery © Esri and its providers' });
    L.circleMarker([c.lat, c.lon], { radius: 9, color: '#FFFFFF', weight: 3, fillColor: '#C4362C', fillOpacity: 1 }).addTo(map);
    let wb = null, rel = null, cfg = null, mode = 'map', cur = null;
    // Capture date of the photo at the marker: Esri's imagery metadata for the release shown (the live
    // satellite layer is the newest release). Layer number = 23 - zoom, as in Esri's own Wayback app.
    const capt = document.getElementById('capt');
    async function loadCfg() {
      if (!cfg) cfg = await (await fetch('https://s3-us-west-2.amazonaws.com/config.maptiles.arcgis.com/waybackconfig.json')).json();
      return cfg;
    }
    async function showCapture(metaUrl) {
      if (!capt) return;
      if (!metaUrl) { capt.textContent = ''; return; }
      capt.textContent = 'Looking up when this image was taken…';
      const layer = Math.max(0, Math.min(13, 23 - map.getZoom()));
      const q = new URLSearchParams({ f: 'json', where: '1=1', outFields: 'SRC_DATE2,NICE_DESC,SRC_DESC,SAMP_RES', returnGeometry: 'false',
        geometry: JSON.stringify({ spatialReference: { wkid: 4326 }, x: c.lon, y: c.lat }), geometryType: 'esriGeometryPoint', spatialRel: 'esriSpatialRelIntersects' });
      try {
        const d = await (await fetch(`${metaUrl}/${layer}/query?${q}`)).json();
        const at = d && d.features && d.features[0] && d.features[0].attributes;
        if (metaUrl !== cur) return;  // the user switched layers meanwhile
        if (!at || !at.SRC_DATE2) { capt.textContent = 'Capture date not published for this spot at this zoom.'; return; }
        const day = new Date(at.SRC_DATE2).toISOString().slice(0, 10);
        capt.innerHTML = `<b>Image of this spot taken ${B.date(day)}</b>` + (at.NICE_DESC ? ` · ${B.esc(at.NICE_DESC)}` : '') +
          (at.SRC_DESC ? ` (${B.esc(at.SRC_DESC)})` : '') + (at.SAMP_RES ? ` · ${(+at.SAMP_RES).toFixed(1)} m per pixel` : '') + ' · Esri imagery metadata';
      } catch (e) { if (metaUrl === cur) capt.textContent = 'Capture date could not be reached from this browser.'; }
    }
    const setCapture = url => { cur = url; showCapture(url); };
    map.on('zoomend', () => { if (mode !== 'map') showCapture(cur); });
    const showRel = i => { const r = rel[i]; if (wb) map.removeLayer(wb);
      wb = L.tileLayer(r.url, { maxZoom: 19, attribution: 'Imagery © Esri (World Imagery Wayback)' }).addTo(map);
      document.getElementById('hDate').textContent = B.date(r.date); document.getElementById('hRange').value = i; setCapture(r.meta); };
    async function newestMeta() {
      try { const v = Object.values(await loadCfg()).filter(x => x.metadataLayerUrl).sort((a, b) => (b.releaseDatetime || 0) - (a.releaseDatetime || 0) || String(b.itemTitle).localeCompare(String(a.itemTitle)))[0]; return v && v.metadataLayerUrl; }
      catch (e) { return null; }
    }
    async function history() {
      const box = document.getElementById('hist'); box.hidden = false;
      if (!rel) {
        try {
          rel = Object.values(await loadCfg()).map(v => ({ date: (v.itemTitle.match(/\d{4}-\d{2}-\d{2}/) || [''])[0], meta: v.metadataLayerUrl,
            url: v.itemURL.replace('{level}', '{z}').replace('{row}', '{y}').replace('{col}', '{x}') })).filter(r => r.date).sort((a, b) => a.date.localeCompare(b.date));
        } catch (e) { box.innerHTML = '<p class="small muted" style="margin:0">The imagery archive could not be reached from this browser.</p>'; return; }
        const rg = document.getElementById('hRange'); rg.max = rel.length - 1; rg.oninput = () => showRel(+rg.value);
        const startD = c.start || (c.events[0] || {}).date;
        const before = startD ? Math.max(0, rel.findIndex(r => r.date >= startD) - 1) : 0;
        document.getElementById('hBefore').onclick = () => showRel(before < 0 ? 0 : before);
        document.getElementById('hLatest').onclick = () => showRel(rel.length - 1);
        showRel(before < 0 ? 0 : before);
      } else showRel(+document.getElementById('hRange').value);
    }
    document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
      document.querySelectorAll('[data-l]').forEach(x => x.classList.toggle('on', x === b));
      [osm, sat].forEach(l => map.removeLayer(l)); if (wb) map.removeLayer(wb);
      document.getElementById('hist').hidden = b.dataset.l !== 'hist';
      mode = b.dataset.l;
      if (mode === 'map') { osm.addTo(map); setCapture(null); }
      else if (mode === 'sat') { sat.addTo(map); cur = 'pending'; newestMeta().then(u => setCapture(u)); }
      else history();
    });
  }
  const aiBtn = document.getElementById('aiBtn');
  if (aiBtn) {
    const reqs = JSON.parse(localStorage.getItem('bantai-ai-req') || '{}');
    const msg = t => document.getElementById('aiMsg').textContent = t;
    if (reqs[c.id]) msg(`Requested ${B.date(reqs[c.id])}. Requests are collected about every hour; the review usually appears here within a few hours.`);
    aiBtn.onclick = async () => {
      if (!relay) { msg('The request channel is not set up yet.'); return; }
      aiBtn.disabled = true; msg('Sending…');
      try {
        const r = await fetch('https://ntfy.sh/' + relay, { method: 'POST', body: c.id });
        if (!r.ok) throw 0;
        reqs[c.id] = new Date().toISOString(); localStorage.setItem('bantai-ai-req', JSON.stringify(reqs));
        msg('Requested. Requests are collected about every hour; the review usually appears here within a few hours.');
      } catch (e) { aiBtn.disabled = false; msg('Could not send the request. Check the connection and try again.'); }
    };
  }
  if (reviewer) {
    const all = JSON.parse(localStorage.getItem('bantai-decisions') || '{}'), mine = all[c.id] || {};
    let pick = mine.pick || null;
    const paint = () => document.querySelectorAll('[data-d]').forEach(b => { b.classList.toggle('on', b.dataset.d === pick); b.setAttribute('aria-checked', String(b.dataset.d === pick)); });
    document.getElementById('why').value = mine.why || '';
    paint();
    document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { pick = b.dataset.d; document.getElementById('derr').textContent = ''; paint(); });
    document.getElementById('save').onclick = () => {
      if (!pick) { document.getElementById('derr').textContent = 'Choose a decision first.'; return; }
      all[c.id] = { pick, why: document.getElementById('why').value.trim(), at: new Date().toISOString() };
      localStorage.setItem('bantai-decisions', JSON.stringify(all));
      const s = document.getElementById('save'); s.textContent = 'Saved'; setTimeout(() => s.textContent = 'Save decision', 1500);
    };
  }
});
</script>
</body>
</html>
